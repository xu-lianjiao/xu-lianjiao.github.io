<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="icon" href="../images/favicon (4).ico">
    <link rel="preload" href="../fonts/jxhandwriting.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" id="main-stylesheet" href="../style.css?v=12">
    <script>
        if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
            const s = document.getElementById('main-stylesheet');
            if (s) s.href = s.getAttribute('href').split('?')[0] + '?t=' + Date.now();
        }
    </script>
    <script>
        (function () {
            if (sessionStorage.getItem('navigated_from_index') === 'true') {
                document.documentElement.classList.add('dock-animate-entry');
                sessionStorage.removeItem('navigated_from_index');
            }

            const fontTimeout = new Promise(resolve => setTimeout(resolve, 1500));
            const resourcesLoaded = Promise.all([
                document.fonts.ready,
                new Promise(resolve => window.addEventListener('load', resolve))
            ]);
            Promise.race([resourcesLoaded, fontTimeout]).then(() => {
                document.documentElement.classList.add('fonts-loaded');
            });
        })();
    </script>
</head>

<body>
    <nav class="subpage-nav">
        <button class="menu-toggle" aria-label="Toggle Navigation" aria-expanded="false">
            <svg class="hamburger-icon" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="8"
                stroke-linecap="round">
                <path class="line-top" d="M 15 28 L 85 28" />
                <path class="line-middle" d="M 15 50 L 85 50" />
                <path class="line-bottom" d="M 15 72 L 85 72" />
            </svg>
        </button>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/about/">About</a>
            <a href="/work/">Work</a>
            <a href="/puzzles/">Puzzles</a>
            <a href="/other/">Other</a>
            <a href="/contact/" class="active">Contact</a>
        </div>
    </nav>
    <main class="container fade-in-up">
        <div class="contact-header-container">
            <h1>Contact</h1>
            <a href="https://www.linkedin.com/in/julian-xiao/" class="linkedin-contact-link" target="_blank"
                rel="noopener noreferrer">
                <svg class="linkedin-contact-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.79M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z" />
                </svg>
                <span>https://www.linkedin.com/in/julian-xiao/</span>
            </a>
        </div>
        <p class="contact-intro">You've reached the end. Thanks for stopping by :)</p>

        <!-- 
            PROTOTYPE NOTE:
            This form is currently structured to run client-side for validation and local prototyping (messages are saved to localStorage).
            To receive these messages privately as the website owner:
            
            1. Sign up for a free form-handling service (e.g., https://formspree.io or https://web3forms.com).
            2. Get your unique form ID or access key.
            3. Update the <form> attributes below:
               action="https://formspree.io/f/YOUR_FORM_ID" method="POST"
            
            The JavaScript submission handler below is already set up to detect the presence of this action URL 
            and automatically post the form data asynchronously (via AJAX/fetch) if you set it!
        -->
        <form class="contact-form" id="contact-form" action="https://api.web3forms.com/submit" method="POST" novalidate>
            <input type="hidden" name="access_key" value="9899ddd8-1e55-4f9b-9852-d270069bc69e">
            <input type="hidden" name="subject" value="New Message from Website">
            <div class="form-row">
                <div class="form-group">
                    <input type="text" id="name" name="name" placeholder="Name" aria-label="Name" required>
                    <span class="error-message" id="name-error"></span>
                </div>
                <div class="form-group">
                    <input type="email" id="email" name="email" placeholder="Email" aria-label="Email" required>
                    <span class="error-message" id="email-error"></span>
                </div>
            </div>
            <div class="form-group">
                <textarea id="message" name="message" placeholder="Message (this goes right to my inbox)"
                    aria-label="Message" rows="4" required></textarea>
                <span class="error-message" id="message-error"></span>
            </div>
            <button type="submit" class="contact-submit-btn">Send</button>
        </form>

        <!-- Success Message (hidden by default) -->
        <div class="contact-success" id="contact-success" style="display: none;">
            <div class="success-icon">
                <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M 22 51 C 28 58, 33 66, 40 73 C 54 55, 68 37, 80 25" />
                </svg>
            </div>
            <h2>Message sent!</h2>
            <p>I'll get back to you soon!</p>
            <button type="button" class="contact-reset-btn" id="new-message-btn">Back</button>
        </div>
    </main>

    <script>
        // Auto-expanding Textarea as user types
        const messageArea = document.getElementById('message');
        if (messageArea) {
            messageArea.addEventListener('input', function () {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
            });
        }

        // Email validation helper
        const emailInput = document.getElementById('email');
        const emailError = document.getElementById('email-error');
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        function validateEmail() {
            const emailVal = emailInput.value.trim();
            if (emailVal === '') {
                emailInput.classList.remove('invalid');
                emailError.textContent = '';
                return false;
            } else if (!emailRegex.test(emailVal)) {
                emailInput.classList.add('invalid');
                emailError.textContent = 'Please enter a valid email.';
                return false;
            } else {
                emailInput.classList.remove('invalid');
                emailError.textContent = '';
                return true;
            }
        }

        if (emailInput) {
            emailInput.addEventListener('input', validateEmail);
            emailInput.addEventListener('blur', validateEmail);
        }

        // Form submission handling
        const form = document.getElementById('contact-form');
        const successCard = document.getElementById('contact-success');
        const newMsgBtn = document.getElementById('new-message-btn');

        if (form) {
            form.addEventListener('submit', function (e) {
                e.preventDefault();

                // Validate all fields before sending
                let isValid = true;

                // Validate name
                const nameInput = document.getElementById('name');
                const nameError = document.getElementById('name-error');
                if (nameInput.value.trim() === '') {
                    nameInput.classList.add('invalid');
                    nameError.textContent = 'Please enter your name.';
                    isValid = false;
                } else {
                    nameInput.classList.remove('invalid');
                    nameError.textContent = '';
                }

                // Validate email
                if (!validateEmail()) {
                    isValid = false;
                }

                // Validate message
                const msgInput = document.getElementById('message');
                const msgError = document.getElementById('message-error');
                if (msgInput.value.trim() === '') {
                    msgInput.classList.add('invalid');
                    msgError.textContent = 'Please enter a message.';
                    isValid = false;
                } else {
                    msgInput.classList.remove('invalid');
                    msgError.textContent = '';
                }

                if (!isValid) return;

                const action = form.getAttribute('action');
                if (action && action.startsWith('http')) {
                    // Send message via AJAX fetch to the active form handling service
                    const submitBtn = form.querySelector('.contact-submit-btn');
                    const originalText = submitBtn.textContent;
                    submitBtn.textContent = 'Sending...';
                    submitBtn.disabled = true;

                    fetch(action, {
                        method: 'POST',
                        body: new FormData(form),
                        headers: {
                            'Accept': 'application/json'
                        }
                    })
                        .then(async (response) => {
                            const json = await response.json().catch(() => ({}));
                            if (response.status === 200 && json.success !== false) {
                                form.style.display = 'none';
                                successCard.style.display = 'flex';
                            } else {
                                alert(json.message || 'Oops! There was a problem submitting your form. Please verify your service configuration.');
                            }
                        })
                        .catch(error => {
                            console.error('Error submitting form:', error);
                            alert('Oops! There was a network problem submitting your form.');
                        })
                        .finally(() => {
                            submitBtn.textContent = originalText;
                            submitBtn.disabled = false;
                        });
                } else {
                    // Prototype fallback: Save to localStorage and log to console
                    const formData = {
                        name: nameInput.value.trim(),
                        email: emailInput.value.trim(),
                        message: msgInput.value.trim(),
                        timestamp: new Date().toISOString()
                    };

                    let messages = JSON.parse(localStorage.getItem('contact_messages') || '[]');
                    messages.push(formData);
                    localStorage.setItem('contact_messages', JSON.stringify(messages));

                    console.log('Saved message prototype to localStorage:', formData);

                    // Show success screen
                    form.style.display = 'none';
                    successCard.style.display = 'flex';
                }
            });
        }

        if (newMsgBtn) {
            newMsgBtn.addEventListener('click', function () {
                // Reset form values
                form.reset();

                // Clear any validation classes & messages
                document.querySelectorAll('.contact-form input, .contact-form textarea').forEach(el => {
                    el.classList.remove('invalid');
                });
                document.querySelectorAll('.error-message').forEach(el => {
                    el.textContent = '';
                });

                // Reset textarea height
                if (messageArea) {
                    messageArea.style.height = 'auto';
                }

                // Toggle views
                successCard.style.display = 'none';
                form.style.display = 'flex';
            });
        }
    </script>
    <script src="../transitions.js?v=13"></script>
</body>

</html>
